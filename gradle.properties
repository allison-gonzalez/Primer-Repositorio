org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# KSP (Room, etc.) aun agrega fuentes generadas via kotlin.sourceSets, API que AGP 9
# con Kotlin integrado desaprueba por defecto. Se permite hasta que KSP publique
# soporte nativo para la nueva API de source sets de AGP 9.
# https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

# API base del backend propio (Node/Express/Postgres) para el cliente OkHttp del companion.
# Usar 10.0.2.2 para el emulador (loopback al host); reemplazar por la IP LAN real en
# dispositivo fisico.
API_BASE_URL=http://10.0.2.2:5000/
