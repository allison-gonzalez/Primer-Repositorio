plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.example.mobileapp'
    compileSdk 37

    defaultConfig {
        // RNF-12: la aplicacion companion requiere Android 10.0 (API 29) o superior.
        // El applicationId debe coincidir con el del modulo reloj (patron "proyecto siames"
        // de la diapositiva de la clase: "el nombre del paquete debe ser el mismo al del
        // primer modulo"). Dos apps en dispositivos fisicos distintos (telefono y reloj)
        // pueden compartir applicationId sin chocar, ya que no compiten por el mismo device.
        applicationId "com.example.reloj"
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        def apiBaseUrl = project.findProperty('API_BASE_URL') ?: 'http://10.0.2.2:5000/'
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Nota: AGP 9 elimino la configuracion "wearApp" (empaquetado embebido del APK de Wear OS).
    // El reloj se instala como app standalone independiente (ya declarado en su manifest:
    // com.google.android.wearable.standalone=true) y se empareja via Data Layer API.
    implementation project(':common')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.play.services.wearable
    implementation libs.kotlinx.coroutines.play.services
    implementation libs.kotlinx.serialization.json
    implementation libs.okhttp
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    implementation libs.datastore.preferences
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.uitooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}
